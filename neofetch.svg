    .dim { fill: #565f89; }
    .title { fill: #bb9af7; font-weight: 700; }
    .row { opacity: 0; animation: in 0.5s ease-out forwards; }
    @keyframes in { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
  </style>
  <rect x="1" y="1" width="898" height="398" rx="12" fill="#1a1b27" stroke="#3b4261"/>
