<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Owais Raza, Data Science student and full-stack developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b27"/>
      <stop offset="1" stop-color="#24283b"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#7aa2f7" stroke-opacity="0.07"/>
    </pattern>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,'SFMono-Regular',Menlo,monospace; }
    .prompt { font-size: 16px; fill: #565f89; }
    .name { font-size: 64px; font-weight: 700; fill: url(#ink); }
    .tag { font-size: 22px; fill: #a9b1d6; }
    .line { opacity: 0; animation: cycle 9s infinite; }
    .l2 { animation-delay: 3s; }
    .l3 { animation-delay: 6s; }
    .orb { animation: float 6s ease-in-out infinite; }
    @keyframes cycle {
      0% { opacity: 0; transform: translateY(8px); }
      6%, 30% { opacity: 1; transform: translateY(0); }
      36%, 100% { opacity: 0; transform: translateY(-8px); }
    }
    @keyframes float { 50% { transform: translateY(-10px); } }
  </style>
  <rect width="900" height="240" rx="14" fill="url(#bg)"/>
  <rect width="900" height="240" rx="14" fill="url(#grid)"/>
  <circle class="orb" cx="790" cy="60" r="92" fill="#bb9af7" opacity="0.09"/>
  <circle class="orb" cx="110" cy="210" r="72" fill="#7aa2f7" opacity="0.09" style="animation-delay:-3s"/>
  <text x="48" y="58" class="mono prompt">owais@github:~$ whoami</text>
  <text x="46" y="136" class="mono name">Owais Raza</text>
  <g class="mono tag">
    <text class="line" x="50" y="184">Data Science student</text>
    <text class="line l2" x="50" y="184">Full-stack developer · C++ to Python</text>
    <text class="line l3" x="50" y="184">Shipping Flux, building AeroNexus</text>
  </g>
</svg>
